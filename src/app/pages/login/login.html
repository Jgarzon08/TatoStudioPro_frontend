<main class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <a routerLink="/" class="login-logo-link" title="Volver al inicio">
        <img src="assets/img-tato-studio.png" alt="Tato Studio Logo" class="login-logo">
      </a>
      <span class="login-badge">Panel CMS</span>
      <h1>Acceso Administrativo</h1>
      <p>Ingresa tus credenciales para gestionar el portafolio y los mensajes.</p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-danger">
        {{ errorMessage() }}
      </div>
    }

    @if (successMessage()) {
      <div class="alert alert-success">
        {{ successMessage() }}
      </div>
    }

    <form (ngSubmit)="onLogin()" class="login-form">
      <div class="input-group-custom">
        <label for="adminEmail">Correo Electrónico</label>
        <input
          type="email"
          id="adminEmail"
          name="email"
          placeholder="admin@tatostudio.com"
          [(ngModel)]="email"
          required
        >
      </div>

      <div class="input-group-custom">
        <label for="adminPassword">Contraseña</label>
        <input
          type="password"
          id="adminPassword"
          name="password"
          placeholder="••••••••"
          [(ngModel)]="password"
          required
        >
      </div>

      <button type="submit" class="btn-primary btn-block" [disabled]="isLoading()">
        {{ isLoading() ? 'Verificando...' : 'Entrar al Administrador' }}
      </button>

      <div class="login-footer-links">
        <a routerLink="/" class="back-link">← Volver al sitio web principal</a>
      </div>
    </form>
  </div>
</main>

<app-footer></app-footer>
